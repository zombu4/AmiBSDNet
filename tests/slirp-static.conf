# AmiBSDNet test configuration for WinUAE's uaenet.device (SLIRP NAT) with
# a fixed address.  SLIRP's gateway 10.0.2.2 is the emulator host, where
# tools/run_emu.py --dns 53 answers DNS queries (amibsdnet.test), so a
# test with this configuration needs no Internet.
hostname   amiga-test
interface  sana0 uaenet.device 0 address 10.0.2.15/24
gateway    10.0.2.2
nameserver 10.0.2.2
